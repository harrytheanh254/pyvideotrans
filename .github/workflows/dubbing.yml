name: Dich va Long Tieng Video AI

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Ten file video trong Repo (VD: video.mp4)'
        required: true
        default: 'video.mp4'
      voice_choice:
        description: 'Giong doc tieng Viet'
        required: true
        default: 'vi-VN-HoaiMyNeural'
        type: choice
        options:
        - 'vi-VN-HoaiMyNeural'
        - 'vi-VN-NamMinhNeural'

jobs:
  dubbing:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon Repo
        uses: actions/checkout@v4

      - name: Cai dat Python va ffmpeg
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cai dat thu vien
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install edge-tts openai-whisper googletrans==3.1.0a0

      - name: Tach am thanh va Xu ly
        run: |
          # 1. Chuyển video thành audio wav 16kHz sạch để Whisper không bị lỗi
          ffmpeg -i "${{ github.event.inputs.input_file }}" -vn -ar 16000 -ac 1 audio_clean.wav -y

          # 2. Chạy Python dịch thuật & lồng tiếng
          python -c "
          import whisper, subprocess
          from googletrans import Translator

          voice = '${{ github.event.inputs.voice_choice }}'
          input_file = '${{ github.event.inputs.input_file }}'

          print('1. Nhan dien tieng Trung...')
          model = whisper.load_model('base')
          result = model.transcribe('audio_clean.wav', language='zh', fp16=False)
          zh_text = result['text']

          print('2. Dich sang tieng Viet...')
          translator = Translator()
          vi_text = translator.translate(zh_text, src='zh-cn', dest='vi').text

          with open('sub_vi.txt', 'w', encoding='utf-8') as f:
              f.write(vi_text)

          print('3. Tao giong doc Edge-TTS...')
          cmd = f'edge-tts --voice {voice} --file sub_vi.txt --write-media voice_vi.mp3'
          subprocess.run(cmd, shell=True, check=True)

          print('4. Ghep audio tieng Viet vao video gốc...')
          output_cmd = f'ffmpeg -i \"{input_file}\" -i voice_vi.mp3 -c:v copy -map 0:v:0? -map 1:a:0 video_tieng_viet.mp4 -y'
          subprocess.run(output_cmd, shell=True)
          "

      - name: Tai ket qua ve máy
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-video-long-tieng
          path: |
            video_tieng_viet.mp4
            voice_vi.mp3
